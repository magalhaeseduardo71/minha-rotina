<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Rotina</title>
<meta name="theme-color" content="#F5F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rotina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0}</style>
</head>
<body>

<div class="app" id="app">
  <header class="head">
    <div>
      <div class="eyebrow" id="h-eyebrow">Hoje</div>
      <div class="date" id="h-date"></div>
    </div>
    <div class="head-btns">
      <button class="icon-btn" id="btn-settings" aria-label="Ajustes" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 0 0-12 0c0 7-3 8.5-3 8.5h18s-3-1.5-3-8.5"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg>
      </button>
      <button class="icon-btn" id="btn-lock" aria-label="Bloquear">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>
    </div>
  </header>

  <section class="week">
    <div class="week-top">
      <span class="week-label" id="w-label"></span>
      <div class="week-nav">
        <button class="chip" id="btn-today" hidden>Hoje</button>
        <button class="nav-btn" id="w-prev" aria-label="Semana anterior"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="nav-btn" id="w-next" aria-label="Próxima semana"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div class="days" id="days"></div>
  </section>

  <section class="summary" id="summary">
    <div class="ring"><svg viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="27"/><circle class="val" id="ring-val" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg><b id="ring-pct">0%</b></div>
    <div class="sum-text"><div class="sum-big" id="sum-big"></div><div class="sum-sub" id="sum-sub"></div></div>
  </section>

  <div class="status" id="status" hidden></div>
  <div id="lists"></div>
</div>

<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Nova atividade</span></button>

<div class="scrim" id="scrim"></div>

<form class="sheet" id="sheet-add" autocomplete="off">
  <div class="grip"></div>
  <h2>Nova atividade</h2>
  <div class="sub" id="add-sub"></div>
  <div class="field"><label for="f-title">O que fazer</label><input class="input" id="f-title" maxlength="120" placeholder="Ex.: Academia" enterkeyhint="done"></div>
  <div class="field"><label for="f-time">Horário (opcional)</label><input class="input" id="f-time" type="time"></div>
  <div class="field" hidden><label>Lembrar</label>
    <div class="row" id="rem-opts">
      <button type="button" class="opt" data-rem="9h">Às 9h do dia</button>
      <button type="button" class="opt" data-rem="1h">1 hora antes</button>
      <button type="button" class="opt" data-rem="0">Na hora</button>
    </div>
  </div>
  <div class="field"><label>Repetir</label>
    <div class="row" id="rep-opts">
      <button type="button" class="opt on" data-rep="once">Só neste dia</button>
      <button type="button" class="opt" data-rep="daily">Todo dia</button>
      <button type="button" class="opt" data-rep="week">Seg a sex</button>
      <button type="button" class="opt" data-rep="custom">Escolher dias</button>
    </div>
    <div class="row" id="wd-opts" hidden></div>
  </div>
  <button class="primary" id="f-save" type="submit" disabled>Adicionar</button>
</form>

<div class="sheet" id="sheet-act"><div class="grip"></div><h2 id="act-title"></h2><div class="sub" id="act-sub"></div><div id="act-list"></div></div>

<div class="sheet" id="sheet-set">
  <div class="grip"></div>
  <h2>Ajustes</h2>
  <div>
    <div class="set-row"><div><div class="t">Notificações</div><div class="d" id="n-desc"></div></div><span id="n-action"></span></div>
    <div class="set-row"><div><div class="t">Testar lembrete</div><div class="d">Chega em 10 segundos. Bloqueie a tela para ver.</div></div><button class="btn-sm" id="n-test">Testar</button></div>
    <div class="set-row"><div><div class="t">Conta</div><div class="d" id="acc-desc"></div></div><button class="btn-sm" id="acc-out">Sair</button></div>
  </div>
  <div class="hint" id="n-hint" hidden></div>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="lock" id="lock">
  <div class="brand">Minha <em>Rotina</em></div>
  <div class="face" id="lock-face"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9.5v1M15 9.5v1M12 9.5v3.5h-1M9.5 16c1.5 1 3.5 1 5 0"/></svg></div>
  <p id="lock-msg"></p>
  <form class="login" id="login" hidden>
    <input class="input" id="l-email" type="email" autocomplete="username" placeholder="Seu e-mail">
    <input class="input" id="l-pass" type="password" autocomplete="current-password" placeholder="Senha (mín. 6 caracteres)">
    <button class="primary" id="l-go" type="submit">Entrar</button>
    <button class="link" id="l-switch" type="button">Primeira vez? Criar conta</button>
  </form>
  <div class="lock-actions" id="lock-actions">
    <button class="primary" id="lock-btn"></button>
    <div class="err" id="lock-err"></div>
    <button class="link" id="lock-skip" hidden>Continuar sem Face ID</button>
  </div>
</div>

<script src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
