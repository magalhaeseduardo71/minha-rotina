name: Publicar app (GitHub Pages)
on:
  push:
    branches: [main]
    paths-ignore: ["firebase/**", "README.md"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar e enviar para o ramo gh-pages
        run: |
          mkdir _site
          cp -r index.html app.js styles.css sw.js firebase-config.js manifest.webmanifest icons _site/
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
